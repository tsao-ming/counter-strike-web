<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FPS Prototype // Armory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <a class="brand" href="?mode=play" aria-label="FPS Prototype home">
        <span class="brand-mark">FP</span>
        <span>FPS PROTOTYPE</span>
      </a>
      <nav class="mode-menu" aria-label="網站模式">
        <button type="button" data-mode="play">PLAY FPS</button>
        <button type="button" data-mode="rifle">RIFLE</button>
        <button type="button" data-mode="pistol">PISTOL</button>
        <button type="button" data-mode="knife">KNIFE</button>
        <button type="button" data-mode="soldier">SOLDIER</button>
      </nav>
    </header>

    <section class="hero-copy">
      <div>
        <p class="eyebrow" id="eyebrow">TRAINING RANGE // PLAYABLE WEBGL</p>
        <h1 id="title">Original tactical FPS prototype</h1>
        <p id="subtitle">Play the range or inspect the procedural black-metal armory in 3D.</p>
      </div>
      <div class="connection" id="connection">READYING</div>
    </section>

    <section class="viewer" aria-label="FPS prototype viewer">
      <iframe id="viewer-frame" title="FPS Prototype WebGL" allow="fullscreen; pointer-lock" allowfullscreen></iframe>
      <div class="viewer-loading" id="viewer-loading">Loading viewer...</div>
    </section>

    <footer class="site-footer">
      <span id="help">Click inside the game to capture the mouse.</span>
      <span>Desktop keyboard + mouse</span>
    </footer>
  </main>

  <script>
    const frame = document.getElementById('viewer-frame');
    const loading = document.getElementById('viewer-loading');
    const connection = document.getElementById('connection');
    const eyebrow = document.getElementById('eyebrow');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const help = document.getElementById('help');
    const labels = {
      play: {
        path: 'Game/index.html?v=respawn-visual-20260904',
        eyebrow: 'TRAINING RANGE // PLAYABLE WEBGL',
        title: 'Original tactical FPS prototype',
        subtitle: 'WASD move, mouse look, and test the rifle, pistol, and knife.',
        help: 'Click inside the game to capture the mouse.'
      },
      rifle: {
        path: 'Showcase/index.html?weapon=rifle&v=respawn-visual-20260904',
        eyebrow: 'ARMORY // PRIMARY WEAPON',
        title: 'Rifle // blue-black precision platform',
        subtitle: 'Drag to rotate. Use the wheel to zoom. Press R to reset the view.',
        help: 'Drag inside the viewer to rotate the rifle.'
      },
      pistol: {
        path: 'Showcase/index.html?weapon=pistol&v=respawn-visual-20260904',
        eyebrow: 'ARMORY // SIDEARM',
        title: 'Pistol // compact energy sidearm',
        subtitle: 'Inspect the slide, independent magazine, rail, and blue energy details.',
        help: 'Drag inside the viewer to rotate the pistol.'
      },
      knife: {
        path: 'Showcase/index.html?weapon=knife&v=respawn-visual-20260904',
        eyebrow: 'ARMORY // MELEE',
        title: 'Knife // tactical energy blade',
        subtitle: 'Inspect the dark grip, serrated spine, metal guard, and energy edge.',
        help: 'Drag inside the viewer to rotate the knife.'
      },
      soldier: {
        path: 'Showcase/index.html?weapon=soldier&v=respawn-visual-20260904',
        eyebrow: 'ARMORY // OPERATIVE',
        title: 'Sci-fi soldier // static armor profile',
        subtitle: 'Inspect the imported SciFiSoldier model and its armor silhouette.',
        help: 'Drag inside the viewer to rotate the soldier.'
      }
    };

    function setMode(mode, replaceHistory) {
      const selected = labels[mode] || labels.play;
      document.querySelectorAll('[data-mode]').forEach(button => {
        button.classList.toggle('selected', button.dataset.mode === (labels[mode] ? mode : 'play'));
        button.setAttribute('aria-pressed', button.classList.contains('selected'));
      });
      eyebrow.textContent = selected.eyebrow;
      title.textContent = selected.title;
      subtitle.textContent = selected.subtitle;
      help.textContent = selected.help;
      connection.textContent = 'LOADING';
      loading.classList.remove('hidden');
      frame.onload = () => {
        loading.classList.add('hidden');
        connection.textContent = 'READY';
      };
      frame.src = selected.path;
      if (replaceHistory) history.replaceState({}, '', '?mode=' + (labels[mode] ? mode : 'play'));
    }

    document.querySelectorAll('[data-mode]').forEach(button => {
      button.addEventListener('click', () => setMode(button.dataset.mode, true));
    });

    const initialMode = new URLSearchParams(location.search).get('mode') || 'play';
    setMode(initialMode, false);
  </script>
</body>
</html>
